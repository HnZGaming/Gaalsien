  <MotdTitle>Welcome {PLAYERNAME}</MotdTitle>
  <Motd>Welcome to HNZ survival server!

PvP is only ever allowed in the PvP sector, unless both parties agree to engage. The PvP sector is a spherical region around the Alien Planet. Any inter-player combats and griefing activities will be prosecuted.

We have several block limit rules. It is strongly advised that you preview your creation in our Creative server before deploying to this server. Notably, subparts -- pistons, rotors, hinges -- are only allowed one blok per grid. This is to keep the server healthy for everyone playing the game. Hope you could understand it and have fun within the rules.

For any other info, type "!wiki" in the chat. To talk to the admins, type "!discord" in the chat. Other useful commands:

- "!longhelp" -- List of all available commands.
- "!sc &lt;keyword&gt;" -- Command search
- "!sg --gps &lt;keyword&gt;" -- Grid search
- "!warp Creative" -- Creative server entrance

Hope you enjoy our community too :)</Motd>
